
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ Real-Time Voice Clone Translator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>🎙️ Real-Time Voice Clone Translator</h1>
    <p>Record your voice and hear it translated and cloned instantly!</p>

    <label>Select Source Language:</label>
    <select id="src-lang">
      <option value="hi">Hindi</option>
      <option value="en" selected>English</option>
      <option value="de">German</option>
      <option value="ja">Japanese</option>
    </select>

    <label>Select Target Language:</label>
    <select id="tar-lang">
      <option value="hi" selected>Hindi</option>
      <option value="en">English</option>
      <option value="de">German</option>
      <option value="ja">Japanese</option>
    </select>

    <div class="controls">
      <button id="recordBtn">🎤 Start Recording</button>
      <button id="stopBtn" disabled>⏹️ Stop</button>
    </div>

    <p id="status" style="color: yellow;"></p>

    <!-- ORIGINAL + CLONED AUDIO COMPARISON -->
    <div class="audio-comparison">
      <div class="audio-box">
        <h3>🎤 Your Original Recording</h3>
        <audio id="originalAudio" controls style="width: 100%; margin-top: 10px;"></audio>
        <small>What you said (source language)</small>
      </div>
      <div class="arrow">➜</div>
      <div class="audio-box">
        <h3>🎧 Cloned & Translated</h3>
        <audio id="outputAudio" controls style="width: 100%; margin-top: 10px;"></audio>
        <small>Your voice in the target language!</small>
      </div>
    </div>
  </div>

  <script>
  let audioContext;
  let input;
  let processor;
  let audioData = [];
  let sampleRate;
  let originalAudioUrl = null;  // Store original blob URL

  const recordBtn = document.getElementById("recordBtn");
  const stopBtn = document.getElementById("stopBtn");
  const originalAudio = document.getElementById("originalAudio");
  const outputAudio = document.getElementById("outputAudio");
  const status = document.getElementById("status");

  recordBtn.onclick = async () => {
    try {
      status.textContent = "Requesting microphone access...";
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      status.textContent = "🎤 Recording started. Speak now!";
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      sampleRate = audioContext.sampleRate;
      input = audioContext.createMediaStreamSource(stream);
      processor = audioContext.createScriptProcessor(4096, 1, 1);

      processor.onaudioprocess = (e) => {
        const inputData = e.inputBuffer.getChannelData(0);
        audioData.push(...inputData);
      };

      input.connect(processor);
      processor.connect(audioContext.destination);

      recordBtn.disabled = true;
      stopBtn.disabled = false;
    } catch (err) {
      status.textContent = `❌ Mic error: ${err.message}`;
      console.error(err);
    }
  };

  stopBtn.onclick = async () => {
    if (input) input.disconnect();
    if (processor) processor.disconnect();
    if (audioContext) audioContext.close();

    if (audioData.length === 0) {
      status.textContent = "❌ No audio recorded. Try again.";
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      return;
    }

    status.textContent = "⏳ Processing (transcribe → translate → clone your voice)...";
    const audioBlob = createWavBlob(audioData, sampleRate);
    
    // Play original immediately
    originalAudioUrl = URL.createObjectURL(audioBlob);
    originalAudio.src = originalAudioUrl;
    originalAudio.play().catch(e => console.log("Original play failed:", e));  // Auto-play may be blocked

    const formData = new FormData();
    formData.append("audio", audioBlob, "recording.wav");
    formData.append("src-lang", document.getElementById("src-lang").value);
    formData.append("tar-lang", document.getElementById("tar-lang").value);

    try {
      const response = await fetch("/process_audio", {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`${response.status}: ${errorText}`);
      }

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      outputAudio.src = url;
      outputAudio.play().catch(e => console.log("Cloned play failed:", e));
      status.textContent = "✅ Done! Compare original vs. cloned (your voice translated).";
    } catch (err) {
      status.textContent = `❌ Error: ${err.message}`;
      console.error(err);
    }

    audioData = [];
    recordBtn.disabled = false;
    stopBtn.disabled = true;
  };

  function createWavBlob(pcmData, sampleRate) {
    const buffer = new ArrayBuffer(44 + pcmData.length * 2);
    const view = new DataView(buffer);

    writeString(view, 0, 'RIFF');
    view.setUint32(4, 36 + pcmData.length * 2, true);
    writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(view, 36, 'data');
    view.setUint32(40, pcmData.length * 2, true);

    let offset = 44;
    for (let i = 0; i < pcmData.length; i++, offset += 2) {
      const sample = Math.max(-1, Math.min(1, pcmData[i]));
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
    }

    return new Blob([view], { type: 'audio/wav' });
  }

  function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }
  </script>
</body>
</html>
